  const previousURL=image.src;reset();assert(revoked.includes(previousURL),'URL locale libérée à la réinitialisation');assert(!d.querySelector('.adam-photo'),'Nouvel Adam réinitialisé');await send();await photo();await answer(2);assert(!d.querySelector('#adam-summary'),'Douleur ne produit pas la synthèse nominale');click('Revoir ma réponse');await answer(0);await answer(1);assert(!d.querySelector('#adam-summary'),'Fièvre non nominale suspendue');click('Revoir ma réponse');await answer(0);await answer(1);assert(!d.querySelector('#adam-summary'),'Piqûre non nominale suspendue');

  reset();await send();click('Ajouter une photo');selectFile();await wait(100);write('Voici la photo.');d.querySelector('#composer').requestSubmit();await wait(100);reset('leo');await wait(1200);assert(!d.querySelector('.adam-observation'),'Timer photo annulé au retour');
  reset();await send();await photo();await answer(0);await answer(0);await answer(0);click('Pas maintenant');click('Choisir un moment');click('Choisir un autre moment');click('Dans 72 h');click('Simuler le point dans 72 h');click('Elle diminue');

  assert(w.AdamData.create('Ça démange un peu. Ça fait mal.').episode.facts['adam.sensation'].status==='ambiguous','Déclarations contradictoires à préciser');
  assert(!w.AdamData.create('Je ne sais pas si j’ai de la fièvre.').episode.facts['adam.general'],'Incertitude non transformée en réponse normale');

  await send('Ça démange un peu.');await photo();assert(latest().dataset.adamQuestion==='general','Textes antérieurs conservés lors de l’envoi multimodal ultérieur');

  reset();await send();click('Ajouter une photo');const stale=d.querySelector('#adam-photo-input');reset('leo');const transfer=new w.DataTransfer();transfer.items.add(fixture);stale.files=transfer.files;stale.dispatchEvent(new w.Event('change'));await wait(1100);assert(!d.querySelector('.adam-photo')&&!d.querySelector('.adam-photo-status'),'Sélection tardive ignorée après changement de profil');
  assert(d.documentElement.scrollWidth===390,'Pas de débordement mobile');assert(errors.length===0,'Aucune erreur JavaScript : '+errors.join());
  results.textContent='PASS — '+checks+' vérifications Adam : parcours, brouillon multimodal, envoi explicite, annulation, transition photo, modales, suivi, branches, isolation et réinitialisation.';
 }catch(error){results.textContent='FAIL après '+checks+' vérifications : '+error.stack;}
